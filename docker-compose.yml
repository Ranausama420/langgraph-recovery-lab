services:
  api:
    build: .
    environment:
      DJANGO_SECRET_KEY: local-compose-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PULSEOPS_ASYNC_JOBS: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql://pulseops:pulseops@postgres:5432/pulseops
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  worker:
    build: .
    command: celery -A reliability worker -l info
    environment:
      DJANGO_SECRET_KEY: local-compose-secret
      DJANGO_DEBUG: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: postgresql://pulseops:pulseops@postgres:5432/pulseops
    depends_on:
      - api
      - redis
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
